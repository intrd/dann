baseURL = "https://dann.com.br/"
languageCode = "en-us"
title = "intrd has spoken"
disableKinds = ["section"]
enableRobotsTXT = true
removePathAccents = true

[pagination]
  pagerSize = 1000

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[taxonomies]
  tag = "tags"

[permalinks.page]
  posts = "/:slug/"

[permalinks.term]
  tags = "/tag/:slug/"

[permalinks.taxonomy]
  tags = "/tag/"

[params]
  github = "https://github.com/intrd"
  keybase = "https://keybase.io/intrd"
  banner = "content/images/2021/08/1500x500.jpeg"
  footer = "content/images/cpaf-footer.png"
  tagTopics = ["ctf", "web security", "cryptography", "pwn", "reverse engineering", "forensics", "programming", "networking", "pentest", "bitcoin", "projects", "hardware", "linux", "malware", "pt_BR"]

  [[params.nav]]
    name = "/teams"
    url = "ctf/"
  [[params.nav]]
    name = "/about"
    url = "about/"
  [[params.nav]]
    name = "/keybase"
    url = "https://keybase.io/intrd"
  [[params.nav]]
    name = "/github"
    url = "https://github.com/intrd"

[mediaTypes."text/x-rss"]
  suffixes = ["html"]

[outputFormats.RSSCOMPAT]
  mediaType = "text/x-rss"
  baseName = "index"
  path = "rss"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "RSSCOMPAT", "JSON"]
