<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  {{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="alternate" type="application/rss+xml" href="{{ "rss/" | absURL }}" title="{{ site.Title }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site">
    <a class="logo" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav>
      <a href="{{ site.Home.RelPermalink }}">/home</a>
      <a href="{{ "ctf/" | relURL }}">/teams</a>
      <a href="{{ "about/" | relURL }}">/about</a>
      <a href="{{ site.Params.keybase }}">/keybase</a>
      <a href="{{ site.Params.github }}">/github</a>
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
</body>
</html>
