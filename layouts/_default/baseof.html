<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  {{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | absURL }}" title="{{ site.Title }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <div class="banner{{ if .IsHome }} home{{ end }}" style="background-image:url('{{ site.Params.banner | relURL }}')">
    <a class="banner-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
  </div>
  {{ partial "nav.html" . }}
  <main>{{ block "main" . }}{{ end }}</main>
  <footer class="site">
    <img class="footer-img" src="{{ site.Params.footer | relURL }}" alt="CPAF: Cyberpunk as fuck. Some material may be inappropriate for technophobes." width="1280" height="503" loading="lazy">
    <p class="poweredby">..and a big thx 4 <a href="https://gohugo.io">Hugo</a> team.</p>
  </footer>
  <script src="{{ "js/search.js" | relURL }}" defer></script>
</body>
</html>
