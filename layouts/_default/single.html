{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ if eq .Type "posts" }}
  <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    {{ range .Params.tags }} <a class="tag" href="{{ (printf "tags/%s/" (. | urlize)) | relURL }}">#{{ . }}</a>{{ end }}</p>
  {{ end }}
  {{ .Content }}
</article>
{{ end }}
