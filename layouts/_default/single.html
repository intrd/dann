{{ define "main" }}
<article>
  {{- if .Params.avatar }}
  <header class="page-head">
    <img class="page-avatar" src="{{ site.Params.avatar | relURL }}" alt="intrd" width="88" height="88">
    <h1>{{ .Title }}</h1>
  </header>
  {{- else }}
  <h1>{{ .Title }}</h1>
  {{- end }}
  {{ if eq .Type "posts" }}
  <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    {{ range .GetTerms "tags" }} <a class="tag" href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}</p>
  {{ end }}
  {{ .Content }}
</article>
{{ end }}
