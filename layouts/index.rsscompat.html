{{- printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>" }}
<rss version="2.0"><channel>
<title>{{ site.Title | htmlEscape }}</title><link>{{ site.Home.Permalink | htmlEscape }}</link>
{{ range first 30 (where site.RegularPages "Type" "posts") }}
<item><title>{{ .Title | htmlEscape }}</title><link>{{ .Permalink | htmlEscape }}</link><pubDate>{{ .Date.Format "Mon, 02 Jan 2006 15:04:05 -0700" }}</pubDate><guid>{{ .Permalink | htmlEscape }}</guid></item>
{{ end }}
</channel></rss>
